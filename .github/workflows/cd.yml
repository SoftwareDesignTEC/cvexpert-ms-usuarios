name: CD

# Despliega a Azure App Service en cada push a main que cambie el código.
# Se autentica con OIDC (federated credential para refs/heads/main): no hay contraseñas en el repo.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pom.xml"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-usuarios
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Pruebas y empaquetado
        run: mvn -B verify

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar a cvexpert-usuarios
        uses: azure/webapps-deploy@v3
        with:
          app-name: cvexpert-usuarios
          package: target/app.jar
