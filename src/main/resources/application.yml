# Ningún valor secreto va aquí. En Azure se definen como variables de entorno
# del App Service, con referencias al Key Vault.
server:
  port: ${PORT:8080}

spring:
  application:
    name: cvexpert-ms-usuarios
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/cvexpert-usuarios}
      auto-index-creation: true

app:
  # Correos separados por coma que quedan como administradores al crear su perfil.
  admin-emails: ${ADMIN_EMAILS:gcabrerarojas.25@gmail.com}
  # Carga los textos legales y de ayuda de src/main/resources/seed si la colección está vacía.
  seed-enabled: ${SEED_ENABLED:true}

apim:
  # Huellas SHA-1 del certificado de cliente de APIM, separadas por coma. Vacío = no se exige
  # (local y pruebas). En Azure se define junto con el modo de certificados de cliente del App Service.
  cert-thumbprints: ${APIM_CERT_THUMBPRINTS:}

springdoc:
  # Swagger UI en /swagger-ui.html, sobre el contrato openapi.yaml y no sobre lo que se genera del
  # código. api-docs queda activo porque, si se apaga, springdoc también apaga Swagger UI.
  swagger-ui:
    url: /openapi.yaml

management:
  endpoints:
    web:
      exposure:
        include: health
